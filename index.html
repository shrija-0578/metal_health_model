<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mental Health Score Predictor</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <!-- Left Section: Input  -->
        <div class="section form-section">
            <h2>Mental Health Assessment</h2>
            <form id="prediction-form">
                <div class="form-group">
                    <label for="age">Age</label>
                    <input type="number" id="age" name="age" min="0" max="100" placeholder="age" >
                </div>

                <div class="form-group">
                    <label for="gender">Gender</label>
                    <select id="gender" name="gender" placeholder="Select Gender" required>
                        <option value="Male">Male</option>
                        <option value="Female">Female</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="country">Country</label>
                    <select id="country" name="country" required>
                        <option value="India">India</option>
                        <option value="USA">USA</option>
                        <option value="Canada">Canada</option>
                        <option value="Australia">Australia</option>
                        <option value="UK">UK</option>
                        <option value="Germany">Germany</option>
                        <option value="Mexico">Mexico</option>
                        <option value="Turkey">Turkey</option>
                        <option value="France">France</option>
                        <option value="Other">Other</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="academic_level">Academic Level</label>
                    <select id="academic_level" name="academic_level" required>
                        <option value="High School">High School</option>
                        <option value="Undergraduate" selected>Undergraduate</option>
                        <option value="Graduate">Graduate</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="most_used_platform">Most Used Platform</label>
                    <select id="most_used_platform" name="most_used_platform" required>
                        <option value="Instagram">Instagram</option>
                        <option value="YouTube">YouTube</option>
                        <option value="WhatsApp">WhatsApp</option>
                        <option value="Facebook">Facebook</option>
                        <option value="LinkedIn">LinkedIn</option>
                        <option value="Snapchat">Snapchat</option>
                        <option value="Twitter">Twitter</option>
                        <option value="TikTok">TikTok</option>
                        <option value="LINE">LINE</option>
                        <option value="KakaoTalk">KakaoTalk</option>
                        <option value="VKontakte">VKontakte</option>
                        <option value="WeChat">WeChat</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="purpose_of_use">Purpose of Use</label>
                    <select id="purpose_of_use" name="purpose_of_use" required>
                        <option value="Networking">Networking</option>
                        <option value="Education">Education</option>
                        <option value="Entertainment">Entertainment</option>
                        <option value="News">News</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="avg_daily_usage_hours">Avg Daily Usage Hours (0-24)</label>
                    <input type="number" id="avg_daily_usage_hours" name="avg_daily_usage_hours" min="0" max="24" step="0.1" required value="4.5">
                </div>

                <div class="form-group">
                    <label for="daily_unlocks">Daily Unlocks</label>
                    <input type="number" id="daily_unlocks" name="daily_unlocks" min="0"placeholder="value" required >
                </div>

                <div class="form-group">
                    <label for="study_hours">Study Hours (0-24)</label>
                    <input type="number" id="study_hours" name="study_hours" min="0" max="24" step="0.1" placeholder="value" required >
                </div>

                <div class="form-group">
                    <label for="physical_activity_hours">Physical Activity Hours (0-24)</label>
                    <input type="number" id="physical_activity_hours" name="physical_activity_hours" min="0" max="24" step="0.1" placeholder="value" required >
                </div>

                <div class="form-group">
                    <label for="sleep_hours_per_night">Sleep Hours Per Night (0-24)</label>
                    <input type="number" id="sleep_hours_per_night" name="sleep_hours_per_night" min="0" max="24" step="0.1" placeholder="value" required >
                </div>

                <div class="form-group">
                    <label for="stress_level">Stress Level</label>
                    <select id="stress_level" name="stress_level" required>
                        <option value="Low">Low</option>
                        <option value="Medium" selected>Medium</option>
                        <option value="High">High</option>
                        <option value="Very High">Very High</option>
                    </select>
                </div>

                <button type="submit" id="submit-btn">Predict Score</button>
            </form>
        </div>

        <!-- Right Section: Predicted Score Display -->
        <div class="section result-section">
            <h2>Prediction Result</h2>
            <div id="result-container" class="result-box neutral">
                <p class="placeholder-text">Fill out the form and click "Predict Score" to view results.</p>
                <div id="score-display" class="hidden">
                    <span class="score-label">Predicted Mental Health Score</span>
                    <h1 id="score-value">--</h1>
                    <p id="score-category" class="score-category"></p>
                </div>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
